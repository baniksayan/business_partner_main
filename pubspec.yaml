name: business_partner_main
description: "Business Partner Dashboard - A comprehensive Flutter application for business management and analytics."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296

  # State Management & Architecture (MVVM)
  provider: ^6.1.2
  get_it: ^7.7.0
  injectable: ^2.4.2

  # HTTP & Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.3

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1

  # Navigation & Routing
  go_router: ^14.2.7
  auto_route: ^8.3.0

  # UI Components & Utilities
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0
  
  # Forms & Validation
  flutter_form_builder: ^9.3.0
  form_builder_validators: ^11.0.0

  # Date & Time
  intl: ^0.19.0
  timeago: ^3.7.0

  # Images & Media
  image_picker: ^1.1.2
  image_cropper: ^8.0.1
  photo_view: ^0.15.0
  flutter_image_compress: ^2.3.0

  # Charts & Analytics
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^26.2.11

  # Permissions
  permission_handler: ^11.3.1

  # Location Services
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Push Notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # File Operations
  path_provider: ^2.1.3
  file_picker: ^8.0.6
  open_file: ^3.3.2

  # URL & Linking
  url_launcher: ^6.3.0
  share_plus: ^10.0.2

  # Loading & Progress Indicators
  flutter_spinkit: ^5.2.1
  lottie: ^3.1.2

  # Utilities
  uuid: ^4.4.2
  logger: ^2.4.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # Localization
  flutter_localizations:
    sdk: flutter

  # QR Code (for business features)
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

  # PDF Generation (for reports)
  pdf: ^3.11.0
  printing: ^5.12.0

  # WebView (for external content)
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.2
  injectable_generator: ^2.6.1
  auto_route_generator: ^8.3.0

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - assets/logos/
    - assets/placeholders/

  # Custom Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
    
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
    
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300

dependency_overrides:
  # Add any dependency overrides if needed
