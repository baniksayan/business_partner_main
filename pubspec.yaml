name: business_partner_main
description: "Business Partner Dashboard - A comprehensive Flutter application for business management and analytics."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Core Dependencies
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.5

  # Charts
  fl_chart: ^1.0.0

  # Image Picker Dependencies
  image_picker: ^1.1.2        # Newly Added: For camera and gallery access
  permission_handler: ^12.0.1 # Newly Added: For explicit permission handling

  # Animation & UI Dependencies (for splash screen and animations)
  animations: ^2.0.11
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2 # Recommended for static analysis

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

    # - family: SF Pro Display
    #   fonts:
    #     - asset: assets/fonts/SF-Pro-Display-Regular.otf
    #     - asset: assets/fonts/SF-Pro-Display-Medium.otf
    #       weight: 500
    #     - asset: assets/fonts/SF-Pro-Display-SemiBold.otf
    #       weight: 600
    #     - asset: assets/fonts/SF-Pro-Display-Bold.otf
    #       weight: 700 