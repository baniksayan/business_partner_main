name: business_partner_main
description: "Business Partner Dashboard - A comprehensive Flutter application for business management and analytics."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  
  # Core Dependencies
  provider: ^6.1.5
  
  # Animation & UI Dependencies (for your splash screen)
  animations: ^2.0.11
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2 # Recommended for static analysis
  
# The following section is specific to Flutter.
flutter:
  uses-material-design: true
